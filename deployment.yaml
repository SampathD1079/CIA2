apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-cicd-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-cicd-demo
  template:
    metadata:
      labels:
        app: cloud-cicd-demo
    spec:
      containers:
        - name: cloud-cicd-demo
          image: ghcr.io/sampathd1079/cloud-cicd-demo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080